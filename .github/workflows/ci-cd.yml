
name: College ERP CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-save html-validate

      - name: Validate HTML files
        run: |
          npx html-validate index.html attendence.html courses.html

      - name: Package application
        run: |
          mkdir -p dist
          cp index.html attendence.html courses.html README.md dist/
          cd dist
          zip -r ../college-erp.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: college-erp-package
          path: college-erp.zip

  deploy:
    name: Deploy to GitHub Pages
    needs: build-test-package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
