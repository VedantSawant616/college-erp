name: Docker CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Application Files
        run: |
          test -f index.html
          test -f attendence.html
          test -f courses.html

      - name: Validate HTML
        run: |
          python -m pip install html5validator
          html5validator --root . \
            --match-filename '^(index|attendence|courses)\.html$'

      - name: Build Docker Image
        run: docker compose build

      - name: Deploy with Docker Compose
        run: docker compose up -d

      - name: Test Deployment
        run: |
          set -e
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ -o /dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:8080/ -o /dev/null
          curl -fsS http://localhost:8080/attendence.html -o /dev/null
          curl -fsS http://localhost:8080/courses.html -o /dev/null

          echo "All application pages are accessible."

      - name: Show Running Containers
        if: always()
        run: docker compose ps

      - name: Stop Containers
        if: always()
        run: docker compose down
